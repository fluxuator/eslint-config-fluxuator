version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: daily
      time: "06:00"
      timezone: "Etc/UTC"

  - package-ecosystem: npm
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: daily
      time: "06:00"
      timezone: "Etc/UTC"
    rebase-strategy: auto
    versioning-strategy: increase

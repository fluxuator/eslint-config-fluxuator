# Saved dependencies will be configured with an exact version rather than using npm's default semver range operator
saveExact: true

publicHoistPattern:
  - "@commitlint*"
  - commitlint

allowBuilds:
  esbuild: false
  unrs-resolver: false

# release-notes-generator v14 uses writer v8; preset v10 requires writer v9.
overrides:
  conventional-changelog-conventionalcommits: 9.3.1
